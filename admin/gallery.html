<!DOCTYPE html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery Admin | MyPainter</title>
    <link rel="stylesheet" href="/css/admin.css" />
    <style>
      .hint {
        color: #555;
        font-size: 0.9rem;
        margin: 0 0 1rem;
      }
      .album-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
      .album-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
        padding: 0.85rem 1rem;
        background: #faf7ef;
        border-radius: 8px;
        border: 2px dashed transparent;
        transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
      }
      .album-row.active { outline: 2px solid #0f3a5f; outline-offset: 1px; }
      .album-row.drag-over {
        background: #e8f4ff;
        border-color: #0f3a5f;
        box-shadow: 0 0 0 3px rgba(15, 58, 95, 0.15);
        cursor: grabbing;
      }
      .album-row .drop-hint {
        margin-left: auto;
        font-size: 0.75rem;
        color: #888;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .album-row.drag-over .drop-hint { opacity: 1; color: #0f3a5f; font-weight: 700; }
      .photo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 0.75rem;
      }
      .photo-grid.drop-over {
        outline: 3px dashed #0f3a5f;
        outline-offset: 4px;
        border-radius: 8px;
        background: rgba(232, 244, 255, 0.5);
      }
      .photo-card {
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.08);
        cursor: grab;
        touch-action: none;
      }
      .photo-card:active { cursor: grabbing; }
      .photo-card.dragging {
        opacity: 0.45;
        cursor: grabbing;
        transform: scale(0.98);
      }
      .photo-card .drag-handle {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.35rem 0.5rem;
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #666;
        background: #f3efe6;
        cursor: grab;
        user-select: none;
      }
      .photo-card .drag-handle::before { content: "✋"; font-size: 0.85rem; }
      .photo-card img {
        width: 100%;
        aspect-ratio: 3/4;
        object-fit: cover;
        display: block;
        pointer-events: none;
        user-select: none;
      }
      .photo-card .meta { padding: 0.5rem; font-size: 0.85rem; }
      .photo-card input { width: 100%; margin-top: 0.35rem; font: inherit; padding: 0.35rem; border: 1px solid #ddd; border-radius: 4px; cursor: text; }
      .photo-card .actions { display: flex; gap: 0.35rem; margin-top: 0.35rem; }
      .photo-card .actions button { flex: 1; font-size: 0.75rem; padding: 0.35rem; cursor: pointer; }
      body.is-dragging .album-row { cursor: grabbing; }
      body.is-dragging-files .album-row:not(.drag-over) { cursor: copy; }
      .photo-card .thumb-btn {
        border: none;
        padding: 0;
        margin: 0;
        background: none;
        display: block;
        width: 100%;
        cursor: pointer;
      }
      .photo-card .thumb-btn:hover img { opacity: 0.92; }
      .photo-card .caption-preview {
        padding: 0.45rem 0.5rem 0.55rem;
        font-size: 0.8rem;
        line-height: 1.3;
        color: #333;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .photo-card .edit-photo {
        width: calc(100% - 1rem);
        margin: 0 0.5rem 0.5rem;
        font-size: 0.75rem;
        padding: 0.4rem;
      }
      /* Upload progress — green line top of screen */
      #upload-progress {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10000;
        background: #fff;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
        transform: translateY(-100%);
        transition: transform 0.2s ease;
      }
      #upload-progress.visible { transform: translateY(0); }
      #upload-progress-bar-wrap {
        height: 5px;
        background: #e8e8e8;
      }
      #upload-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #22a06b, #3d9a5f);
        transition: width 0.25s ease;
      }
      #upload-progress-text {
        padding: 0.55rem 1rem;
        font-size: 0.85rem;
        font-weight: 700;
        color: #0d5c2e;
      }
      /* Edit photo modal */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 9998;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .modal-backdrop[hidden] { display: none; }
      .modal-box {
        background: #fff;
        border-radius: 12px;
        max-width: 720px;
        width: 100%;
        max-height: 92vh;
        overflow: auto;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      }
      .modal-box header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid #eee;
      }
      .modal-box header h2 { margin: 0; font-size: 1.15rem; }
      .modal-close {
        border: none;
        background: #f3efe6;
        border-radius: 8px;
        width: 2.25rem;
        height: 2.25rem;
        font-size: 1.25rem;
        cursor: pointer;
        line-height: 1;
      }
      .modal-body { padding: 1.25rem; }
      .modal-preview {
        width: 100%;
        max-height: 55vh;
        object-fit: contain;
        background: #f3efe6;
        border-radius: 8px;
        display: block;
        margin-bottom: 1rem;
      }
      .modal-body .field textarea { min-height: 72px; }
    </style>
  </head>
  <body class="admin-body">
    <div class="admin-wrap">
      <div class="admin-header">
        <a href="/admin/"><img src="/images/logo.png" alt="MyPainter" /></a>
        <div class="btn-row" style="margin:0">
          <a href="/gallery.html" class="btn btn-ghost">View gallery</a>
          <button type="button" class="btn btn-ghost" id="logout-btn">Log out</button>
        </div>
      </div>

      <div id="gate" class="admin-card"><p>Checking login…</p></div>
      <div id="app" hidden>
        <div class="admin-card">
          <h1>Gallery folders</h1>
          <p class="hint">Drag photos onto a folder to move them, or drop image files straight in. ✋ grab handle on each photo.</p>
          <div class="admin-grid">
            <div class="field">
              <label>New folder name</label>
              <input id="new-album-title" placeholder="e.g. Grant's Job" />
            </div>
            <div class="field" style="justify-content:flex-end">
              <label>&nbsp;</label>
              <button type="button" class="btn btn-primary" id="create-album-btn">Create folder</button>
            </div>
          </div>
          <div id="album-list" class="album-list"></div>
        </div>

        <div class="admin-card" id="photos-panel" hidden>
          <h2 id="photos-title">Photos</h2>
          <div class="field">
            <label>Upload photos</label>
            <input type="file" id="upload-input" accept="image/*" multiple />
          </div>
          <div id="photo-grid" class="photo-grid"></div>
        </div>
      </div>
    </div>

    <div id="upload-progress" aria-live="polite" aria-hidden="true">
      <div id="upload-progress-bar-wrap"><div id="upload-progress-bar"></div></div>
      <div id="upload-progress-text">Uploading…</div>
    </div>

    <div id="edit-modal" class="modal-backdrop" hidden>
      <div class="modal-box" role="dialog" aria-labelledby="edit-modal-title">
        <header>
          <h2 id="edit-modal-title">Edit photo</h2>
          <button type="button" class="modal-close" id="edit-modal-close" aria-label="Close">×</button>
        </header>
        <div class="modal-body">
          <img id="edit-modal-img" class="modal-preview" alt="" />
          <div class="field">
            <label for="edit-modal-caption">Caption / job name</label>
            <textarea id="edit-modal-caption" rows="2" placeholder="e.g. Exterior Repaint — Kamo"></textarea>
          </div>
          <div class="field">
            <label for="edit-modal-alt">Alt text (accessibility)</label>
            <input id="edit-modal-alt" type="text" placeholder="Describe the photo briefly" />
          </div>
          <div class="btn-row">
            <button type="button" class="btn btn-primary" id="edit-modal-save">Save</button>
            <button type="button" class="btn btn-danger" id="edit-modal-delete">Delete</button>
            <button type="button" class="btn btn-ghost" id="edit-modal-cancel">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      let albums = [];
      let activeAlbumId = null;
      let dragPhotoId = null;
      let currentPhotos = [];
      let editingPhotoId = null;

      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/"/g, "&quot;");
      }

      async function api(path, opts = {}) {
        const res = await fetch(path, opts);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || res.statusText);
        return data;
      }

      function clearDropHighlights() {
        document.querySelectorAll(".album-row.drag-over").forEach((el) => el.classList.remove("drag-over"));
        document.getElementById("photo-grid")?.classList.remove("drop-over");
        document.body.classList.remove("is-dragging", "is-dragging-files");
      }

      function bindAlbumDropTargets() {
        document.querySelectorAll(".album-row").forEach((row) => {
          row.addEventListener("dragenter", (e) => {
            e.preventDefault();
            row.classList.add("drag-over");
          });
          row.addEventListener("dragover", (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = dragPhotoId || e.dataTransfer.types.includes("Files") ? "move" : "copy";
            row.classList.add("drag-over");
          });
          row.addEventListener("dragleave", (e) => {
            if (!row.contains(e.relatedTarget)) row.classList.remove("drag-over");
          });
          row.addEventListener("drop", async (e) => {
            e.preventDefault();
            row.classList.remove("drag-over");
            clearDropHighlights();
            const albumId = row.dataset.id;
            const photoId = e.dataTransfer.getData("application/x-mp-photo");
            try {
              if (photoId) {
                await movePhoto(photoId, albumId);
              } else if (e.dataTransfer.files?.length) {
                await uploadFiles(e.dataTransfer.files, albumId);
              }
            } catch (err) {
              alert(err.message || "Drop failed");
            }
          });
        });
      }

      function bindPhotoGridDrop() {
        const grid = document.getElementById("photo-grid");
        if (!grid || !activeAlbumId) return;

        grid.addEventListener("dragenter", (e) => {
          if (!e.dataTransfer.types.includes("Files")) return;
          e.preventDefault();
          grid.classList.add("drop-over");
        });
        grid.addEventListener("dragover", (e) => {
          if (!e.dataTransfer.types.includes("Files")) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "copy";
          grid.classList.add("drop-over");
        });
        grid.addEventListener("dragleave", (e) => {
          if (!grid.contains(e.relatedTarget)) grid.classList.remove("drop-over");
        });
        grid.addEventListener("drop", async (e) => {
          if (!e.dataTransfer.files?.length) return;
          e.preventDefault();
          grid.classList.remove("drop-over");
          clearDropHighlights();
          try {
            await uploadFiles(e.dataTransfer.files, activeAlbumId);
          } catch (err) {
            alert(err.message || "Upload failed");
          }
        });
      }

      document.body.addEventListener("dragenter", (e) => {
        if (e.dataTransfer.types.includes("Files")) document.body.classList.add("is-dragging-files");
      });
      document.body.addEventListener("dragend", clearDropHighlights);
      document.body.addEventListener("drop", clearDropHighlights);

      async function requireAuth() {
        const me = await fetch("/api/auth/me").then((r) => r.json());
        if (!me.authenticated) {
          location.href = "/admin/";
          return false;
        }
        document.getElementById("gate").hidden = true;
        document.getElementById("app").hidden = false;
        return true;
      }

      async function loadAlbums() {
        const data = await api("/api/gallery/albums");
        albums = data.albums || [];
        renderAlbums();
      }

      function renderAlbums() {
        const el = document.getElementById("album-list");
        el.innerHTML = albums
          .map(
            (a) => `
          <div class="album-row ${a.id === activeAlbumId ? "active" : ""}" data-id="${a.id}">
            <strong>${esc(a.title)}</strong>
            <span style="color:#666;font-size:0.85rem">/${esc(a.slug)}</span>
            <button type="button" class="btn btn-ghost open-album">Open</button>
            <button type="button" class="btn btn-ghost rename-album">Rename</button>
            <button type="button" class="btn btn-danger delete-album">Delete</button>
            <span class="drop-hint">Drop here ✋</span>
          </div>`,
          )
          .join("");

        el.querySelectorAll(".open-album").forEach((btn) =>
          btn.addEventListener("click", () => openAlbum(btn.closest(".album-row").dataset.id)),
        );
        el.querySelectorAll(".rename-album").forEach((btn) =>
          btn.addEventListener("click", async () => {
            const id = btn.closest(".album-row").dataset.id;
            const album = albums.find((a) => a.id === id);
            const title = prompt("Folder name", album.title);
            if (!title) return;
            await api(`/api/gallery/albums/${id}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ title }),
            });
            await loadAlbums();
          }),
        );
        el.querySelectorAll(".delete-album").forEach((btn) =>
          btn.addEventListener("click", async () => {
            const id = btn.closest(".album-row").dataset.id;
            if (!confirm("Delete this folder and all its photos?")) return;
            await api(`/api/gallery/albums/${id}`, { method: "DELETE" });
            if (activeAlbumId === id) {
              activeAlbumId = null;
              document.getElementById("photos-panel").hidden = true;
            }
            await loadAlbums();
          }),
        );

        bindAlbumDropTargets();
      }

      async function openAlbum(id) {
        activeAlbumId = id;
        renderAlbums();
        const album = albums.find((a) => a.id === id);
        document.getElementById("photos-panel").hidden = false;
        document.getElementById("photos-title").textContent = `Photos — ${album.title}`;
        await loadPhotos();
      }

      async function movePhoto(photoId, targetAlbumId) {
        if (!photoId || !targetAlbumId) return;
        await api(`/api/gallery/photos/${photoId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ albumId: targetAlbumId }),
        });
        if (activeAlbumId) await loadPhotos();
      }

      function showUploadProgress(current, total, fileName) {
        const el = document.getElementById("upload-progress");
        const bar = document.getElementById("upload-progress-bar");
        const text = document.getElementById("upload-progress-text");
        const pct = total ? Math.round((current / total) * 100) : 0;
        el.classList.add("visible");
        el.setAttribute("aria-hidden", "false");
        bar.style.width = `${pct}%`;
        text.textContent = current >= total
          ? `Done — ${total} photo${total === 1 ? "" : "s"} uploaded ✓`
          : `Uploading ${current}/${total}… ${fileName || ""}`;
      }

      function hideUploadProgress(delayMs = 1800) {
        setTimeout(() => {
          const el = document.getElementById("upload-progress");
          el.classList.remove("visible");
          el.setAttribute("aria-hidden", "true");
          document.getElementById("upload-progress-bar").style.width = "0%";
        }, delayMs);
      }

      function openEditModal(photo) {
        editingPhotoId = photo.id;
        document.getElementById("edit-modal-img").src = photo.url;
        document.getElementById("edit-modal-img").alt = photo.altText || photo.caption || "";
        document.getElementById("edit-modal-caption").value = photo.caption || "";
        document.getElementById("edit-modal-alt").value = photo.altText || photo.caption || "";
        document.getElementById("edit-modal").hidden = false;
        document.getElementById("edit-modal-caption").focus();
      }

      function closeEditModal() {
        editingPhotoId = null;
        document.getElementById("edit-modal").hidden = true;
      }

      async function saveEditModal() {
        if (!editingPhotoId) return;
        const caption = document.getElementById("edit-modal-caption").value.trim();
        const altText = document.getElementById("edit-modal-alt").value.trim() || caption;
        await api(`/api/gallery/photos/${editingPhotoId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ caption, altText }),
        });
        closeEditModal();
        await loadPhotos();
      }

      async function deleteEditModal() {
        if (!editingPhotoId || !confirm("Delete this photo?")) return;
        await api(`/api/gallery/photos/${editingPhotoId}`, { method: "DELETE" });
        closeEditModal();
        await loadPhotos();
      }

      async function uploadFiles(fileList, albumId) {
        if (!albumId) throw new Error("Pick a folder first");
        const files = [...fileList].filter((f) => f.type.startsWith("image/"));
        if (!files.length) throw new Error("No image files found");
        const total = files.length;
        let lastUploaded = null;

        showUploadProgress(0, total, files[0].name);
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          showUploadProgress(i, total, file.name);
          const fd = new FormData();
          fd.append("file", file);
          fd.append("albumId", albumId);
          fd.append("caption", file.name.replace(/\.[^.]+$/, "").replace(/[-_]/g, " "));
          const res = await fetch("/api/gallery/upload", { method: "POST", body: fd });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Upload failed");
          lastUploaded = data.photo;
          showUploadProgress(i + 1, total, file.name);
        }

        hideUploadProgress();
        if (activeAlbumId === albumId) await loadPhotos();
        if (lastUploaded && total === 1) openEditModal(lastUploaded);
      }

      async function loadPhotos() {
        const data = await api(`/api/gallery/photos?albumId=${activeAlbumId}`);
        currentPhotos = data.photos || [];
        const grid = document.getElementById("photo-grid");
        grid.innerHTML = currentPhotos
          .map(
            (p) => `
          <div class="photo-card" data-id="${p.id}" draggable="true">
            <div class="drag-handle">Drag to folder</div>
            <button type="button" class="thumb-btn edit-open" aria-label="Edit photo">
              <img src="${esc(p.url)}" alt="${esc(p.altText)}" draggable="false" />
            </button>
            <div class="caption-preview">${esc(p.caption) || "Untitled"}</div>
            <button type="button" class="btn btn-accent edit-photo edit-open">Edit / rename</button>
          </div>`,
          )
          .join("");

        grid.querySelectorAll(".photo-card").forEach((card) => {
          card.addEventListener("dragstart", (e) => {
            if (e.target.closest(".edit-open, .thumb-btn")) {
              e.preventDefault();
              return;
            }
            dragPhotoId = card.dataset.id;
            document.body.classList.add("is-dragging");
            card.classList.add("dragging");
            e.dataTransfer.setData("application/x-mp-photo", dragPhotoId);
            e.dataTransfer.effectAllowed = "move";
            if (e.dataTransfer.setDragImage) {
              const img = card.querySelector("img");
              if (img) e.dataTransfer.setDragImage(img, 40, 50);
            }
          });
          card.addEventListener("dragend", () => {
            dragPhotoId = null;
            card.classList.remove("dragging");
            clearDropHighlights();
          });
        });

        grid.querySelectorAll(".edit-open").forEach((btn) =>
          btn.addEventListener("click", () => {
            const photo = currentPhotos.find((p) => p.id === btn.closest(".photo-card").dataset.id);
            if (photo) openEditModal(photo);
          }),
        );

        bindPhotoGridDrop();
      }

      document.getElementById("create-album-btn").addEventListener("click", async () => {
        const title = document.getElementById("new-album-title").value.trim();
        if (!title) return;
        await api("/api/gallery/albums", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title }),
        });
        document.getElementById("new-album-title").value = "";
        await loadAlbums();
      });

      document.getElementById("upload-input").addEventListener("change", async (e) => {
        if (!activeAlbumId) return alert("Open a folder first");
        try {
          await uploadFiles(e.target.files, activeAlbumId);
        } catch (err) {
          alert(err.message || "Upload failed");
        }
        e.target.value = "";
      });

      document.getElementById("logout-btn").addEventListener("click", async () => {
        await fetch("/api/auth/logout", { method: "POST" });
        location.href = "/admin/";
      });

      document.getElementById("edit-modal-close").addEventListener("click", closeEditModal);
      document.getElementById("edit-modal-cancel").addEventListener("click", closeEditModal);
      document.getElementById("edit-modal-save").addEventListener("click", () =>
        saveEditModal().catch((err) => alert(err.message)),
      );
      document.getElementById("edit-modal-delete").addEventListener("click", () =>
        deleteEditModal().catch((err) => alert(err.message)),
      );
      document.getElementById("edit-modal").addEventListener("click", (e) => {
        if (e.target.id === "edit-modal") closeEditModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !document.getElementById("edit-modal").hidden) closeEditModal();
      });

      (async () => {
        if (await requireAuth()) await loadAlbums();
      })();
    </script>
  </body>
</html>
