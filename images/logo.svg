<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-label="mypainter.co.nz">
  <defs>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1.5" dy="1.5" stdDeviation="0.6" flood-color="#4a4a4a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Unified dark outline via stroke on grouped text -->
  <g filter="url(#soft)" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-style="italic" font-weight="900" letter-spacing="-2">
    <text x="18" y="78" font-size="72" fill="#FDD85D" stroke="#5a5a5a" stroke-width="10" paint-order="stroke fill" stroke-linejoin="round">my</text>
    <text x="118" y="78" font-size="72" fill="#ffffff" stroke="#5a5a5a" stroke-width="10" paint-order="stroke fill" stroke-linejoin="round">painter</text>
    <text x="400" y="92" font-size="28" fill="#FDD85D" stroke="#5a5a5a" stroke-width="6" paint-order="stroke fill" stroke-linejoin="round">.co.nz</text>
  </g>
</svg>
